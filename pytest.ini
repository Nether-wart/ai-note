; ADR 0007 的布局（新的 server/ 与冻结的 proto/ 并存）自带一个撞名坑：
; 收集 proto/test_mastery.py 时它会把自己的目录插进 sys.path，于是
; `proto/server.py` 把新的 `server/` 包整个遮住（`from server import …` → ImportError）。
; norecursedirs 把 proto 排除在收集之外，撞名就不可能发生；
; pythonpath 让 `from server import …` 不依赖当前工作目录。
; 裁决 D6：所有工单照这套跑测试。
[pytest]
testpaths = server/tests
norecursedirs = proto docs data samples runs .worktrees .git
pythonpath = .
